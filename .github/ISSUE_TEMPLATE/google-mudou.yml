name: 🔧 O Google mudou o formato
description: Campos vazios, "resposta em formato inesperado" ou o diagnóstico falhando
labels: [google-format-changed]
body:
  - type: markdown
    attributes:
      value: |
        O programa lê respostas internas do Google, que mudam sem aviso. Este relato ajuda a corrigir rápido.
        Veja também [como contribuir com a correção](https://github.com/lucianumm/extrator-google-maps/blob/main/CONTRIBUTING.md#o-google-mudou-o-formato).
        **Remova dados pessoais e cookies** do que colar.
  - type: textarea
    id: diagnostico
    attributes:
      label: Resultado do diagnóstico
      description: Rode `npm run diagnostico` (ou **Avançado → Executar diagnóstico**) e cole a saída.
      render: text
    validations:
      required: true
  - type: textarea
    id: sintoma
    attributes:
      label: O que está vindo errado ou vazio?
      placeholder: "Ex.: telefone e site vazios em todos os lugares; nota sempre nula."
    validations:
      required: true
  - type: input
    id: consulta
    attributes:
      label: Consulta usada
      placeholder: pizzaria em São Paulo - SP
  - type: input
    id: ambiente
    attributes:
      label: Versão do programa, sistema e país/rede
      placeholder: "1.0.0 · Windows 11 · Brasil"
    validations:
      required: true
