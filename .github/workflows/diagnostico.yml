name: Diagnóstico do Google

# Roda toda segunda-feira (e sob demanda) o diagnóstico dos endpoints do Google Maps.
# Se falhar, o Google provavelmente mudou o formato (ou bloqueou o IP do runner do GitHub):
# confira o log antes de concluir que algo quebrou. Veja CONTRIBUTING.md.

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run diagnostico
